name: Release P2PT Server & Alpine Appliance

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Set up NFPM
        uses: goreleaser/nfpm/actions/setup-nfpm@v2

      - name: Build Binaries and APK packages
        run: |
          chmod +x build.sh
          ./build.sh

      - name: Build Alpine Appliance SD Image
        uses: josejuanmontiel/appliance-builder@main
        with:
          recipe: appliance.yaml
          name: p2pt-box

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
            output/*.img.gz
            output/*.tar.gz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
