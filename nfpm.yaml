name: "p2pt-server"
arch: "${ARCH}"
platform: "linux"
version: "1.5.2"
section: "net"
priority: "optional"
maintainer: "Jose Juan Montiel"
description: "P2PT Standalone Server (PeerJS + Pion TURN/STUN)"
homepage: "https://estoyqueloleo-max.github.io/p2pt"
license: "MIT"

contents:
  - src: ${BIN_PATH}
    dst: /usr/bin/p2pt-server
    file_info:
      mode: 0755
  - src: ./services/p2pt
    dst: /etc/init.d/p2pt
    file_info:
      mode: 0755
  - src: ../dist/
    dst: /var/lib/p2pt/web/
    file_info:
      mode: 0644
      dir_mode: 0755
